services:
  - type: web
    name: kasilivescore
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Keep all provider/auth/database secrets configured in Render.
      # Do not commit API keys or DATABASE_URL to this file.
