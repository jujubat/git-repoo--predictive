[build]
  functions = "netlify/functions"
  publish   = "."

[[redirects]]
  from = "/sitemap.xml"
  to   = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/api/football/*"
  to   = "/.netlify/functions/football"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Phase 7: server-render important SEO routes first.
# Set JUDE_BACKEND_URL in Netlify to the deployed FastAPI server.
# The function falls back to index.html if the backend is unavailable.
[[redirects]]
  from = "/football"
  to = "/.netlify/functions/seo?path=/football"
  status = 200
  force = true

[[redirects]]
  from = "/today"
  to = "/.netlify/functions/seo?path=/today"
  status = 200
  force = true

[[redirects]]
  from = "/weekend"
  to = "/.netlify/functions/seo?path=/weekend"
  status = 200
  force = true

[[redirects]]
  from = "/match/*"
  to = "/.netlify/functions/seo?path=/match/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/team/*"
  to = "/.netlify/functions/seo?path=/team/:splat"
  status = 200
  force = true

[[redirects]]
