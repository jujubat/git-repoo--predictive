  force = true

[[redirects]]
  from = "/rugby"
  to   = "/.netlify/functions/seo?path=/rugby"
  status = 200
  force = true

[[redirects]]
  from = "/rugby/*"
  to   = "/.netlify/functions/seo?path=/rugby/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cricket"
  to   = "/.netlify/functions/seo?path=/cricket"
