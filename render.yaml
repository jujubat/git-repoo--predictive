services:
  - type: web
    name: kasiscore
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AFOOT_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_ADMIN_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "1"
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESET_DEV_MODE
        value: "0"
